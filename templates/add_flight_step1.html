<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Add Flight - Step 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="page">

    <nav class="topbar">
        <div class="logo">
            <h2 style="color: #007bff; margin: 0;">Add Flight</h2>
        </div>
        <div class="topbar-actions">
             <a class="btn btn-gray small" href="/flights">Back to Flights</a>
        </div>
    </nav>

    <div class="container">

        <div class="card card-narrow">

            <span class="step-label">Step 1 of 2</span>

            <h2>Basic Flight Information</h2>

            <p class="page-subtitle">Select the schedule and route to proceed.</p>

            {% if error %}
                <div class="error-message">
                    <strong>Error:</strong> {{ error }}
                </div>
            {% endif %}

            <form action="/add_flight?step=1" method="POST">

                <div class="form-group">
                    <label class="form-label">Departure Date:</label>
                    <input type="date" name="dep_date" class="form-control"
                           min="{{ min_date }}"
                           value="{{ request.form.get('dep_date', '') }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Departure Time:</label>
                    <input type="time" name="dep_time" class="form-control"
                           value="{{ request.form.get('dep_time', '') }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Route:</label>
                    <select name="route_id" class="form-control" required>
                        <option value="" disabled {% if not request.form.get('route_id') %}selected{% endif %}>Choose a route...</option>
                        {% for route in routes %}
                            <option value="{{ route.RouteID }}"
                                {% if request.form.get('route_id') == route.RouteID|string %}selected{% endif %}>
                                {{ route.SourceAirport }} to {{ route.DestinationAirport }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="footer-actions">
                    <button type="submit" class="btn btn-blue" style="width: auto;">Next: Choose Plane & Crew</button>
                    </div>
            </form>
        </div>
    </div>
</body>
</html>
