<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>FlyTau - Manager Login</title>
</head>
<body dir="ltr">
    <div class="split-container">
        <div class="left-side">
            <div class="badge">MANAGEMENT</div>
            <h1>Portal Control</h1>
            <p>Secure access for flight managers and administrators</p>
        </div>

        <div class="right-side">
            <div class="content-box">
                <img src="{{ url_for('static', filename='flytau_logo.jpeg') }}" class="logo">
                <h2>Manager Login</h2>

                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                <form method="POST">
                    <div class="form-group">
                        <label>MANAGER ID</label>
                        <input type="text" name="manager_id" placeholder="Enter ID" required pattern="[0-9]{9}" maxlength="9" title="ID must be exactly 9 digits">
                    </div>
                    <div class="form-group">
                        <label>PASSWORD</label>
                        <input type="password" name="password" placeholder="Enter Password" required>
                    </div>

                    <button type="submit" class="btn btn-blue" style="margin-top: 20px;">LOGIN</button>
                </form>

                <div style="margin-top: 20px;">
                    <a href="/" style="color: #007AFF; text-decoration: none; font-size: 14px;">Back to Welcome Page</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
